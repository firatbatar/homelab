name: filebrowser

services:
  filebrowser:
    image: filebrowser/filebrowser:latest
    container_name: filebrowser
    env_file: .env
    environment:
      - PUID=1000
      - PGID=1000
    volumes:
      - ${FB_EXTERNAL_PATH?error}:/srv/external
      - ${FB_INTERNAL_PATH?error}:/srv/internal
      - ./database.db:/database.db
      - ./settings.json:/config/settings.json
    ports:
      - ${FB_WEB_PORT}:80
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80"]
      interval: 30s
      retries: 3
      start_period: 10s
      timeout: 10s
    restart: unless-stopped

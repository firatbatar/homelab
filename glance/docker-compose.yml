name: glance

services:
  glance:
    container_name: glance
    image: glanceapp/glance
    env_file: .env
    volumes:
      - ./config:/app/config
      - ./assets:/app/assets
      - /etc/localtime:/etc/localtime:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - ${GLANCE_PORT?error}:8080
    restart: unless-stopped

- name: Home
  columns:
    - size: small
      widgets:
        - type: to-do
        
        - type: releases
          cache: 1d
          show-source-icon: true
          token: ${GITHUB_READONLY_TOKEN}
          repositories:
            # - firatbatar/firatbatar.github.io
            - gohugoio/hugo
            - spring-projects/spring-boot
            - portainer/portainer

        - type: rss
          limit: 5
          collapse-after: 3
          cache: 24h
          feeds:
            - url: https://feeds.buzzsprout.com/794573.rss
              title: O Tarz Mı?
            - url: https://rss.art19.com/the-newest-olympian
              title: The Newest Olympian

        # Jellyfin Stats by @lfvelosoh
        # https://github.com/glanceapp/community-widgets/blob/main/widgets/jellyfin-emby-stats/README.md
        - type: custom-api
          title: "Jellyfin Stats"
          base-url: ${JELLYFIN_DOMAIN_URL}
          options:
            url: ${JELLYFIN_DOMAIN_URL}
            key: ${JELLYFIN_API_KEY}
          template: |
            {{ $url := .Options.StringOr "url" "" }}
            {{ $key := .Options.StringOr "key" "" }}

            {{- if or (eq $url "") (eq $key "") -}}
            
              <p>Error: The URL or API Key was not configured in the widget options.</p>
              
            {{- else -}}

              {{- $requestUrl := printf "%s/emby/Items/Counts?api_key=%s" $url $key -}}
              {{- $jellyfinData := newRequest $requestUrl | getResponse -}}

              {{- if eq $jellyfinData.Response.StatusCode 200 -}}
                <div class="flex flex-column gap-5">
                  <div class="flex justify-between text-center">
                    
                    <div>
                      <div class="color-highlight size-h3">{{ $jellyfinData.JSON.Int "MovieCount" | formatNumber }}</div>
                      <div class="size-h5 uppercase">Movies</div>
                    </div>

                    <div>
                      <div class="color-highlight size-h3">{{ $jellyfinData.JSON.Int "SeriesCount" | formatNumber }}</div>
                      <div class="size-h5 uppercase">TV Shows</div>
                    </div>

                    <div>
                      <div class="color-highlight size-h3">{{ $jellyfinData.JSON.Int "EpisodeCount" | formatNumber }}</div>
                      <div class="size-h5 uppercase">Episodes</div>
                    </div>

                    <div>
                      <div class="color-highlight size-h3">{{ $jellyfinData.JSON.Int "SongCount" | formatNumber }}</div>
                      <div class="size-h5 uppercase">Songs</div>
                    </div>

                  </div>
                </div>
              {{- else -}}
                <p>Failed: {{ $jellyfinData.Response.Status }}</p>
              {{- end -}}
            {{- end -}}

    - size: full
      widgets:
        - type: group
          widgets:
            - type: hacker-news
              collapse-after: 3
        - type: group
          widgets:
            - type: videos
              channels:
                - UCKkeveNcsI3POExhFO_yg1A # Geekyapar!
                - UCbTN4UyXYhnddRJsu6emIhw # Paula Deming
              limit: 10
              collapse-after: 5

            - type: reddit
              subreddit: GeekyaparOfficial
              show-thumbnails: true

            - type: reddit
              subreddit: ProgrammerHumor
              show-thumbnails: true
        
    - size: small
      widgets:
        - type: clock
          hour-format: 12h
          timezones:
            - timezone: America/New_York
              label: New York
            - timezone: Asia/Tokyo
              label: Tokyo
  
        - type: calendar
          first-day-of-week: monday

        - type: weather
          location: Istanbul
          units: metric
          hour-format: 12h

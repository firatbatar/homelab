- name: Hub
  columns:
    - size: small
      widgets:
        - type: server-stats
          servers:
            - type: local
              name: Server
              hide-mountpoints-by-default: true
              mountpoints:
                "/":
                  hide: false
                  name: Main SSD
                "/mnt/ext_ssd1":
                  hide: false
                  name: External SSD
        
        - type: dns-stats
          service: pihole-v6
          url: ${PIHOLE_DOMAIN_URL}
          password: ${PIHOLE_PASSWORD}

        - type: repository
          token: ${GITHUB_READONLY_TOKEN}
          repository: firatbatar/homelab
          pull-requests-limit: 5
          issues-limit: 3
          commits-limit: 3

        # Leetcode daily questions preview by @hohaithuy
        # https://github.com/glanceapp/community-widgets/blob/main/widgets/leetcode-daily-question/README.md
        - type: custom-api
          title: LeetCode Daily Question
          cache: 6h
          url: https://leetcode.com/graphql
          method: POST
          headers:
            Accept: application/json
          body-type: json
          body:
            query: |
              query questionOfToday {
                activeDailyCodingChallengeQuestion {
                  link
                  question {
                    questionId
                    title
                    difficulty
                    topicTags {
                      name
                      slug
                    }
                  }
                }
              }
            operationName: questionOfToday
          template: |
            <div class="leetcode-card">
              <style>
                .leetcode-card {
                  max-width: 600px;
                  margin: 8px auto;
                  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
                  transition: transform 0.2s ease, box-shadow 0.2s ease;
                }
                .leetcode-card h1 {
                  font-size: 24px;
                  margin: 0 0 16px;
                  line-height: 1.3;
                }
                .leetcode-card h1 a {
                  color: #8CAAEE;
                  text-decoration: none;
                  transition: color 0.2s ease;
                }
                .leetcode-card h1 a:hover {
                  color: #BAC8FF;
                  text-decoration: underline;
                }
                .leetcode-card p {
                  margin: 8px 0;
                  color: #C6D0F5;
                  font-size: 16px;
                }
                .leetcode-card .difficulty {
                  font-weight: 600;
                  color: #A5ADCE;
                }
                .leetcode-card .difficulty.Easy {
                  color: #A6D189;
                }
                .leetcode-card .difficulty.Medium {
                  color: #E5C890;
                }
                .leetcode-card .difficulty.Hard {
                  color: #E78284;
                }
                .leetcode-card .topics {
                  display: flex;
                  flex-wrap: wrap;
                  gap: 8px;
                  margin: 12px 0;
                }
                .leetcode-card .topic-tag {
                  background: #CA9EE6;
                  color: #303446;
                  padding: 4px 12px;
                  border-radius: 16px;
                  font-size: 14px;
                  font-weight: 500;
                  transition: transform 0.2s ease;
                }
                .leetcode-card .topic-tag:hover {
                  transform: scale(1.05);
                }
                .leetcode-card .premium {
                  color: #E78284;
                  font-weight: 600;
                  margin-top: 12px;
                }
                @media (max-width: 600px) {
                  .leetcode-card {
                    padding: 16px;
                    margin: 8px;
                  }
                  .leetcode-card h1 {
                    font-size: 20px;
                  }
                  .leetcode-card p {
                    font-size: 14px;
                  }
                  .leetcode-card .topic-tag {
                    font-size: 12px;
                    padding: 3px 10px;
                  }
                }
              </style>
              <h1>
                <a href="https://leetcode.com{{ .JSON.String "data.activeDailyCodingChallengeQuestion.link" }}" target="_blank">
                  {{ .JSON.String "data.activeDailyCodingChallengeQuestion.question.questionId" }} - {{ .JSON.String "data.activeDailyCodingChallengeQuestion.question.title" }}
                </a>
              </h1>
              <p class="difficulty {{ .JSON.String "data.activeDailyCodingChallengeQuestion.question.difficulty" }}"><strong>Difficulty:</strong> {{ .JSON.String "data.activeDailyCodingChallengeQuestion.question.difficulty" }}</p>
              <p><strong>Topics:</strong></p>
              <div class="topics">
                {{ if .JSON.Exists "data.activeDailyCodingChallengeQuestion.question.topicTags" }}
                  {{ range .JSON.Array "data.activeDailyCodingChallengeQuestion.question.topicTags" }}
                    <span class="topic-tag">{{ .String "name" }}</span>
                  {{ end }}
                {{ else }}
                  <span class="topic-tag">None</span>
                {{ end }}
              </div>
              {{ if .JSON.Bool "data.activeDailyCodingChallengeQuestion.question.paidOnly" }}
                <p class="premium">This is a Premium question</p>
              {{ end }}
            </div>

    - size: full
      widgets:
        - type: search
          autofocus: true
          search-engine: google
          new-tab: true
          bangs:
            - title: YouTube
              shortcut: "!yt"
              url: https://www.youtube.com/results?search_query={QUERY}
            - title: Github
              shortcut: "!gh"
              url: https://github.com/search?q={QUERY}&type=repositories
        
        - type: monitor
          cache: 1m
          title: Services
          sites:
            - title: Portainer
              url: ${PORTAINER_DOMAIN_URL}
              check-url: ${PORTAINER_DOMAIN_URL}  # For some reaseon bare url is rejected
              icon: ${PORTAINER_ICON}
                
            - title: WireGuard
              url: ${WG_EASY_DOMAIN_URL}
              check-url: ${WG_EASY_URL}
              icon: ${WG_EASY_ICON}

            - title: NGINX Proxy Manager
              url: ${NGINX_DOMAIN_URL}
              check-url: ${NGINX_URL}
              icon: ${NGINX_ICON}
                
            - title: Pi-Hole
              url: ${PIHOLE_DOMAIN_URL}/admin
              check-url: ${PIHOLE_URL}/admin
              icon: ${PIHOLE_ICON}
            
            - title: Filebrowser
              url: ${FB_DOMAIN_URL}
              check_url: ${FB_URL}
              icon: ${FB_ICON}

            - title: Jellyfin
              url: ${JELLYFIN_DOMAIN_URL}
              check-url: ${JELLYFIN_URL}
              icon: ${JELLYFIN_ICON}
                
            - title: Uptime Kuma
              url: ${UPTIME_KUMA_DOMAIN_URL}
              check-url: ${UPTIME_KUMA_URL}
              icon: ${UPTIME_KUMA_ICON}
                
            - title: Speedtest Tracker
              url: ${SPEEDTEST_DOMAIN_URL}
              check-url: ${SPEEDTEST_URL}
              icon: ${SPEEDTEST_ICON}
              timeout: 30s
                
            - title: MC Aggregator
              url: ${MC_AGGREGATOR_DOMAIN_URL}/status
              check-url: ${MC_AGGREGATOR_URL}/status
              icon: ${MC_AGGREGATOR_ICON}
              timeout: 30s
                
        # - type: monitor
        #   cache: 1m
        #   title: Servarr
        #   sites:
#       - title: qBittorrent
#         url: 
#         check-url: 
#         icon: di:qbittorrent
#       - title: File Browser
#         url: 
#         icon: di:filebrowser
#       - title: Portainer
#         url: 
#         check-url: 
#         icon: di:portainer

    - size: small
      widgets:
        # Speedtest Tracker by @not-first
        # https://github.com/glanceapp/community-widgets/blob/main/widgets/speedtest-tracker/README.md 
        - type: custom-api
          title: Speedtest Tracker
          cache: 1h
          timeout: 30s
          url: ${SPEEDTEST_DOMAIN_URL}/api/v1/results/latest
          headers:
            Authorization: Bearer ${SPEEDTEST_TOKEN}
          subrequests:
            stats:
              url: ${SPEEDTEST_DOMAIN_URL}/api/v1/stats
              headers:
                Authorization: Bearer ${SPEEDTEST_TOKEN}
                Accept: application/json
          options:
            showPercentageDiff: true
          template: |
            {{ $showPercentage := .Options.BoolOr "showPercentageDiff" true }}

            {{ $stats := .Subrequest "stats" }}
            <div class="flex justify-between text-center margin-block-3">
            <div>
                {{ $downloadChange := percentChange ($stats.JSON.Float "data.download.avg_bits") (.JSON.Float "data.download_bits")
                }}
                {{ if $showPercentage }}
                <div
                class="size-small {{ if gt $downloadChange 0.0 }}color-positive{{ else if lt $downloadChange 0.0 }}color-negative{{ else }}color-primary{{ end }}"
                style="display: inline-flex; align-items: center;">
                {{ $downloadChange | printf "%+.1f%%" }}
                {{ if gt $downloadChange 0.0 }}
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor"
                    style="height: 1em; margin-left: 0.25em;" class="size-4">
                    <path fill-rule="evenodd"
                    d="M9.808 4.057a.75.75 0 0 1 .92-.527l3.116.849a.75.75 0 0 1 .528.915l-.823 3.121a.75.75 0 0 1-1.45-.382l.337-1.281a23.484 23.484 0 0 0-3.609 3.056.75.75 0 0 1-1.07.01L6 8.06l-3.72 3.72a.75.75 0 1 1-1.06-1.061l4.25-4.25a.75.75 0 0 1 1.06 0l1.756 1.755a25.015 25.015 0 0 1 3.508-2.85l-1.46-.398a.75.75 0 0 1-.526-.92Z"
                    clip-rule="evenodd" />
                </svg>
                {{ else if lt $downloadChange 0.0 }}
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor"
                    style="height: 1em; margin-left: 0.25em;" class="size-4">
                    <path fill-rule="evenodd"
                    d="M1.22 4.22a.75.75 0 0 1 1.06 0L6 7.94l2.761-2.762a.75.75 0 0 1 1.158.12 24.9 24.9 0 0 1 2.718 5.556l.729-1.261a.75.75 0 0 1 1.299.75l-1.591 2.755a.75.75 0 0 1-1.025.275l-2.756-1.591a.75.75 0 1 1 .75-1.3l1.097.634a23.417 23.417 0 0 0-1.984-4.211L6.53 9.53a.75.75 0 0 1-1.06 0L1.22 5.28a.75.75 0 0 1 0-1.06Z"
                    clip-rule="evenodd" />
                </svg>
                {{ end }}
                </div>
                {{ end }}
                <div class="color-highlight size-h3">{{ .JSON.Float "data.download_bits" | mul 0.000001 | printf "%.1f" }}</div>
                <div class="size-h6">DOWNLOAD</div>
            </div>
            <div>
                {{ $uploadChange := percentChange ($stats.JSON.Float "data.upload.avg_bits") (.JSON.Float "data.upload_bits") }}
                {{ if $showPercentage }}
                <div
                class="size-small {{ if gt $uploadChange 0.0 }}color-positive{{ else if lt $uploadChange 0.0 }}color-negative{{ else }}color-primary{{ end }}"
                style="display: inline-flex; align-items: center;">
                {{ $uploadChange | printf "%+.1f%%" }}
                {{ if gt $uploadChange 0.0 }}
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor"
                    style="height: 1em; margin-left: 0.25em;" class="size-4">
                    <path fill-rule="evenodd"
                    d="M9.808 4.057a.75.75 0 0 1 .92-.527l3.116.849a.75.75 0 0 1 .528.915l-.823 3.121a.75.75 0 0 1-1.45-.382l.337-1.281a23.484 23.484 0 0 0-3.609 3.056.75.75 0 0 1-1.07.01L6 8.06l-3.72 3.72a.75.75 0 1 1-1.06-1.061l4.25-4.25a.75.75 0 0 1 1.06 0l1.756 1.755a25.015 25.015 0 0 1 3.508-2.85l-1.46-.398a.75.75 0 0 1-.526-.92Z"
                    clip-rule="evenodd" />
                </svg>
                {{ else if lt $uploadChange 0.0 }}
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor"
                    style="height: 1em; margin-left: 0.25em;" class="size-4">
                    <path fill-rule="evenodd"
                    d="M1.22 4.22a.75.75 0 0 1 1.06 0L6 7.94l2.761-2.762a.75.75 0 0 1 1.158.12 24.9 24.9 0 0 1 2.718 5.556l.729-1.261a.75.75 0 0 1 1.299.75l-1.591 2.755a.75.75 0 0 1-1.025.275l-2.756-1.591a.75.75 0 1 1 .75-1.3l1.097.634a23.417 23.417 0 0 0-1.984-4.211L6.53 9.53a.75.75 0 0 1-1.06 0L1.22 5.28a.75.75 0 0 1 0-1.06Z"
                    clip-rule="evenodd" />
                </svg>
                {{ end }}
                </div>
                {{ end }}
                <div class="color-highlight size-h3">{{ .JSON.Float "data.upload_bits" | mul 0.000001 | printf "%.1f" }}</div>
                <div class="size-h6">UPLOAD</div>
            </div>
            <div>
                {{ $pingChange := percentChange ($stats.JSON.Float "data.ping.avg") (.JSON.Float "data.ping") }}
                {{ if $showPercentage }}
                <div
                class="size-small {{ if gt $pingChange 0.0 }}color-negative{{ else if lt $pingChange 0.0 }}color-positive{{ else }}color-primary{{ end }}"
                style="display: inline-flex; align-items: center;">
                {{ $pingChange | printf "%+.1f%%" }}
                {{ if lt $pingChange 0.0 }}
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor"
                    style="height: 1em; margin-left: 0.25em;" class="size-4">
                    <path fill-rule="evenodd"
                    d="M1.22 4.22a.75.75 0 0 1 1.06 0L6 7.94l2.761-2.762a.75.75 0 0 1 1.158.12 24.9 24.9 0 0 1 2.718 5.556l.729-1.261a.75.75 0 0 1 1.299.75l-1.591 2.755a.75.75 0 0 1-1.025.275l-2.756-1.591a.75.75 0 1 1 .75-1.3l1.097.634a23.417 23.417 0 0 0-1.984-4.211L6.53 9.53a.75.75 0 0 1-1.06 0L1.22 5.28a.75.75 0 0 1 0-1.06Z"
                    clip-rule="evenodd" />
                </svg>
                {{ else if gt $pingChange 0.0 }}
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor"
                    style="height: 1em; margin-left: 0.25em;" class="size-4">
                    <path fill-rule="evenodd"
                    d="M9.808 4.057a.75.75 0 0 1 .92-.527l3.116.849a.75.75 0 0 1 .528.915l-.823 3.121a.75.75 0 0 1-1.45-.382l.337-1.281a23.484 23.484 0 0 0-3.609 3.056.75.75 0 0 1-1.07.01L6 8.06l-3.72 3.72a.75.75 0 1 1-1.06-1.061l4.25-4.25a.75.75 0 0 1 1.06 0l1.756 1.755a25.015 25.015 0 0 1 3.508-2.85l-1.46-.398a.75.75 0 0 1-.526-.92Z"
                    clip-rule="evenodd" />
                </svg>
                {{ end }}
                </div>
                {{ end }}
                <div class="color-highlight size-h3">{{ .JSON.Float "data.ping" | printf "%.0f ms" }}</div>
                <div class="size-h6">PING</div>
            </div>
            </div>

        # WG-Easy Enabled Clients by @lmriccardo
        # https://github.com/glanceapp/community-widgets/blob/main/widgets/wg-easy-clients/README.md
        # Modified version taken from https://github.com/ginesjunior11/glance-dashboard-config
        - type: custom-api
          title: WG-Easy Clients
          cache: 5m
          url: ${WG_EASY_DOMAIN_URL}/api/session
          method: POST
          body-type: json
          body:
            password: "${WG_EASY_PASSWORD}"
          template: |
            {{ if eq .Response.StatusCode 200 }}
              {{ $cookie := .Response.Header.Get "Set-Cookie" }}
              {{ $sid := findMatch "connect\\.sid=([^;]+)" $cookie }}
              {{
                $clients := newRequest "http://wireguard.firatbatar.com/api/wireguard/client"
                  | withHeader "Cookie" $sid
                  | getResponse
              }}
              <div>
                {{ range $client := $clients.JSON.Array "" }}
                <div class="flex items-center gap-10 margin-bottom-5">
                  <span>{{ if $client.Bool "enabled" }}🟢{{ else }}🔴{{ end }}</span>
                  <span class="size-h4">{{ $client.String "name" }}</span>
                  <span class="color-subdue size-h5">{{ $client.String "address" }}</span>
                </div>
                {{ end }}
              </div>
            {{ else }}
              <p class="color-negative">Error: {{ .Response.Status }}</p>
            {{ end }}

        # Portainer Dashboard by @RealTong
        # https://github.com/glanceapp/community-widgets/blob/main/widgets/portainer-dashboard/README.md
        - type: custom-api
          title: Portainer
          cache: 10m
          url: ${PORTAINER_DOMAIN_URL}/api/endpoints/${PORTAINER_ENDPOINT_ID}
          headers:
            X-API-Key: ${PORTAINER_API_KEY}
          template: |
            <style>
              .list-horizontal-text.no-bullets > *:not(:last-child)::after {
                  content: none !important;
              }
              .list-horizontal-text.no-bullets > *:not(:last-child) {
                margin-right: 1em;
              }
            </style>
            <div style="display:flex; align-items:center; gap:12px;">
                <div style="width:40px; height:40px; flex-shrink:0; display:flex; justify-content:center; align-items:center; overflow:hidden;">
                  <img src="https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/portainer-dark.svg" width="24" height="24" style="object-fit:contain;">
                </div>
                <div style="flex-grow:1; min-width:0;">
                  <a class="size-h4 block text-truncate color-highlight">
                    {{ .JSON.String "Name" }}
                    <span style="width: 8px; height: 8px; border-radius: 50%; background-color: var(--color-positive); display: inline-block; vertical-align: middle;"></span>
                  </a>
                  <ul class="list-horizontal-text no-bullets">
                    <li data-popover-type="text" data-popover-text="Containers: {{ .JSON.Int "Snapshots.0.ContainerCount" }}">
                      <p style="display:inline-flex;align-items:center;">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="height:1em;vertical-align:middle;margin-right:0.5em;" class="size-6 lucide lucide-box icon inline-flex" aria-hidden="true" role="img"><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"></path><path d="m3.3 7 8.7 5 8.7-5"></path><path d="M12 22V12"></path></svg>
                        {{ .JSON.Int "Snapshots.0.ContainerCount" }}
                      </p>
                    </li>
                    <li data-popover-type="text" data-popover-text="Volumes: {{ .JSON.Int "Snapshots.0.VolumeCount" }}">
                      <p style="display:inline-flex;align-items:center;">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="height:1em;vertical-align:middle;margin-right:0.5em;" class="size-6 lucide lucide-database icon inline-flex" aria-hidden="true" role="img"><ellipse cx="12" cy="5" rx="9" ry="3"></ellipse><path d="M3 5V19A9 3 0 0 0 21 19V5"></path><path d="M3 12A9 3 0 0 0 21 12"></path></svg>
                        {{ .JSON.Int "Snapshots.0.VolumeCount"  }}
                      </p>
                    </li>
                    <li data-popover-type="text" data-popover-text="Networks: {{ .JSON.Int "Snapshots.0.DockerSnapshotRaw.Networks.#" }}">
                      <p style="display:inline-flex;align-items:center;">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="height:1em;vertical-align:middle;margin-right:0.5em;" class="size-6 lucide lucide-network icon inline-flex" aria-hidden="true" role="img"><rect x="16" y="16" width="6" height="6" rx="1"></rect><rect x="2" y="16" width="6" height="6" rx="1"></rect><rect x="9" y="2" width="6" height="6" rx="1"></rect><path d="M5 16v-3a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1v3"></path><path d="M12 12V8"></path></svg>
                        {{ .JSON.Int "Snapshots.0.DockerSnapshotRaw.Networks.#" }}
                      </p>
                    </li>
                  </ul>
                </div>
            </div>
            <div class="margin-block-2" style="margin-top: 1em">
              <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                <div>
                  <div class="size-h5">Running</div>
                  <div class="size-h3 color-highlight">{{ .JSON.Int "Snapshots.0.RunningContainerCount" }}</div>
                </div>
                <div>
                  <div class="size-h5">Healthy</div>
                  <div class="size-h3 color-highlight">{{ .JSON.Int "Snapshots.0.HealthyContainerCount" }}</div>
                </div>
                <div>
                  <div class="size-h5">Stopped</div>
                  <div class="size-h3 color-highlight">{{ .JSON.Int "Snapshots.0.StoppedContainerCount" }}</div>
                </div>
                <div>
                  <div class="size-h5">Unhealthy</div>
                  <div class="size-h3 color-highlight">{{ .JSON.Int "Snapshots.0.DockerSnapshotRaw.Containers.#(Health=\"unhealthy\").#" }}</div>
                </div>
              </div>
            </div>
        
        # Minecraft Server by @not-first
        # https://github.com/glanceapp/community-widgets/blob/main/widgets/minecraft-server/README.md
        # modified by me (@firatbatar) to display more than one server
        - type: custom-api
          title: Minecraft Servers
          url: ${MC_AGGREGATOR_DOMAIN_URL}/status
          cache: 30s
          template: |
            <div style="display:flex; flex-direction:column; gap:12px;">
              {{ range .JSON.Array "" }}
              <div style="display:flex; align-items:center; gap:12px;">
                <div style="width:40px; height:40px; flex-shrink:0; border-radius:4px; display:flex; justify-content:center; align-items:center; overflow:hidden;">
                  {{ if and (.Bool "online") (.String "icon") }}
                    <img src="{{ .String "icon" | safeURL }}" width="40" height="40" style="object-fit:contain;">
                  {{ else }}
                    <img src="${MC_AGGREGATOR_ICON}" width="40" height="40" style="object-fit:contain;">
                  {{ end }}
                </div>

                <div style="flex-grow:1; min-width:0;">
                  <a class="size-h4 block text-truncate color-highlight">
                    {{ .String "host" }}:{{ .String "port" }}
                    {{ if .Bool "online" }}
                    <span
                      style="width:8px; height:8px; border-radius:50%; background-color:var(--color-positive); display:inline-block; vertical-align:middle;"
                      data-popover-type="text"
                      data-popover-text="Online"
                    ></span>
                    {{ else }}
                    <span
                      style="width:8px; height:8px; border-radius:50%; background-color:var(--color-negative); display:inline-block; vertical-align:middle;"
                      data-popover-type="text"
                      data-popover-text="Offline"
                    ></span>
                    {{ end }}
                  </a>

                  <ul class="list-horizontal-text">
                    <li>
                      {{ if .Bool "online" }}
                      <span>{{ .String "version.name_clean" }}</span>
                      {{ else }}
                      <span>Offline</span>
                      {{ end }}
                    </li>
                    {{ if .Bool "online" }}
                    <li data-popover-type="html">
                      <div data-popover-html>
                        {{ range .Array "players.list" }}{{ .String "name_clean" }}<br>{{ end }}
                      </div>
                      <p style="display:inline-flex;align-items:center;">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" style="height:1em;vertical-align:middle;margin-right:0.5em;">
                          <path fill-rule="evenodd" d="M7.5 6a4.5 4.5 0 1 1 9 0 4.5 4.5 0 0 1-9 0ZM3.751 20.105a8.25 8.25 0 0 1 16.498 0 .75.75 0 0 1-.437.695A18.683 18.683 0 0 1 12 22.5c-2.786 0-5.433-.608-7.812-1.7a.75.75 0 0 1-.437-.695Z" clip-rule="evenodd" />
                        </svg>
                        {{ .Int "players.online" | formatNumber }}/{{ .Int "players.max" | formatNumber }} players
                      </p>
                    </li>
                    {{ else }}
                    <li>
                      <p style="display:inline-flex;align-items:center;">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" style="height:1em;vertical-align:middle;margin-right:0.5em;opacity:0.5;">
                          <path fill-rule="evenodd" d="M7.5 6a4.5 4.5 0 1 1 9 0 4.5 4.5 0 0 1-9 0ZM3.751 20.105a8.25 8.25 0 0 1 16.498 0 .75.75 0 0 1-.437.695A18.683 18.683 0 0 1 12 22.5c-2.786 0-5.433-.608-7.812-1.7a.75.75 0 0 1-.437-.695Z" clip-rule="evenodd" />
                        </svg>
                        0 players
                      </p>
                    </li>
                    {{ end }}
                  </ul>
                </div>
              </div>
              {{ end }}
            </div>

name: pihole

services:
  pihole:
    container_name: pihole
    image: pihole/pihole:latest
    env_file: .env
    environment:
      TZ: ${TIMEZONE}
      FTLCONF_webserver_api_password: ${PIHOLE_PASSWORD}
      FTLCONF_webserver_api_ratelimit_count: 0
      FTLCONF_dns_listeningMode: 'ALL'
    ports:
      # DNS Ports
      - "53:53/tcp"
      - "53:53/udp"
      - "${PIHOLE_PORT}:80/tcp"  # HTTP Port
      - "${PIHOLE_HTTPS_PORT}:443/tcp" # HTTPs Port
    volumes:
      - './etc-pihole:/etc/pihole'
    cap_add:
      - NET_ADMIN
      - SYS_TIME
      - SYS_NICE
    restart: unless-stopped
